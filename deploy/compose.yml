---

services:
  shortener-migrate:
    image: ghcr.io/calvin-macoley/container-cicd-platform:${IMAGE_TAG:?}
    command: ["node", "server/dist/migrate.js"]
    environment:
        - DATABASE_URL=${DATABASE_URL:?}
        - APP_ENV=${APP_ENV:?}
    networks:
      - shortener-network
    depends_on:
      shortener-db:
        condition: service_healthy
    restart: "no" # one shot job => no restart needed

  shortener-app:
    image: ghcr.io/calvin-macoley/container-cicd-platform:${IMAGE_TAG:?}
    environment:
        - DATABASE_URL=${DATABASE_URL:?}
        - APP_ENV=${APP_ENV:?}
        - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?}
    stop_grace_period: 30s # controls how long Docker waits while it's shutting down
    ports:
      - 8000:8000
    networks:
      - shortener-network
    depends_on:
      shortener-migrate:
        condition: service_completed_successfully

  shortener-db:
    image: docker.io/library/postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
        - POSTGRES_USER=${POSTGRESDB_USER:?}
        - POSTGRES_PASSWORD=${POSTGRESDB_ROOT_PASSWORD:?}
        - POSTGRES_DB=${POSTGRESDB_DATABASE:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s # controls how Docker judges health while a container is booting
    networks:
      - shortener-network
    volumes:
      - pgs_data:/var/lib/postgresql/data 

networks:
  shortener-network:

volumes:
  pgs_data:
