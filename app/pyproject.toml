[project]
name = "shortener"
version = "0.1.0"
description = "URL shortener API used to demonstrate container-based multi-environment delivery."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Floors are the versions the test suite runs against (see uv.lock); the
    # code uses features absent from older releases (e.g. Starlette's
    # HTTP_422_UNPROCESSABLE_CONTENT, alembic.ini path_separator).
    "alembic>=1.20,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.142,<1",
    "prometheus-client>=0.26,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortener"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "RET", "TID",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["shortener"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --cov=shortener --cov-report=term-missing"
markers = [
    "integration: needs a PostgreSQL database at DATABASE_URL (skipped when unset)",
]

# --- coverage ---------------------------------------------------------------
[tool.coverage.run]
source = ["shortener"]
branch = true
# SQLAlchemy async runs DB calls in greenlets; without this, lines after an
# await inside the repository are reported as missed even though they ran.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
